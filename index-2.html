<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yourname — Creator Hub</title>
<meta name="description" content="Сетап, гир, промокоды и статистика каналов.">
<meta property="og:title" content="yourname — Creator Hub">
<meta property="og:description" content="Сетап, гир, промокоды и статистика каналов.">
<meta property="og:image" content="https://YOURDOMAIN.com/og-image.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
<!-- Inter нужен только как запасной вариант для Windows/Android, где нет Helvetica Neue -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* ШРИФТЫ: меняются в одном месте */
  --sans:"Helvetica Neue","Inter",Helvetica,Arial,sans-serif;
  --serif:"Apple Myungjo","AppleMyungjo","Iowan Old Style",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  --bg:#0a0a0a; --surface:#131313; --surface2:#1b1b1b; --line:#242424;
  --text:#f2f2f2; --muted:#8b8b8b; --good:#5fd38d; --warm:#f2c14e; --warm-bg:rgba(242,193,78,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme]){--bg:#fafafa;--surface:#fff;--surface2:#f1f1f1;--line:#e4e4e4;--text:#111;--muted:#6f6f6f;--good:#18814a;--warm:#8a5d00;--warm-bg:rgba(138,93,0,.1)}
}
:root[data-theme="light"]{--bg:#fafafa;--surface:#fff;--surface2:#f1f1f1;--line:#e4e4e4;--text:#111;--muted:#6f6f6f;--good:#18814a;--warm:#8a5d00;--warm-bg:rgba(138,93,0,.1)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
.col{max-width:680px;margin:0 auto;padding:72px 16px 40px}
.mono{font-family:var(--mono)}

.theme{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:5}

/* profile */
.profile{text-align:center}
.avatar{width:88px;height:88px;border-radius:50%;object-fit:cover;border:1px solid var(--line);margin:0 auto 18px;display:grid;place-items:center;background:var(--surface2);font:400 34px var(--serif)}
h1{margin:0;font:400 2.1rem/1.1 var(--serif);letter-spacing:-.01em;display:inline-flex;align-items:center;gap:8px}
.meta{margin:10px 0 0;color:var(--muted);font:400 .78rem var(--mono);letter-spacing:.02em}
.bio{max-width:520px;margin:16px auto 0;color:var(--muted)}
.strip{display:flex;justify-content:center;gap:clamp(18px,6vw,44px);margin:28px 0 0;padding:20px 0;border-block:1px solid var(--line)}
.strip div{text-align:center}
.strip .n{font:600 1.5rem/1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.strip .l{margin-top:6px;font:400 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* link rows */
.links{display:grid;gap:10px;margin-top:24px}
.link{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;transition:border-color .15s}
.link:hover{border-color:var(--muted)}
.link .ic{width:40px;height:40px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font:500 .72rem var(--mono);color:var(--muted)}
.link b{display:block;font-weight:500}
.link small{color:var(--muted)}
.link .go{margin-left:auto;color:var(--muted)}
.hero-img{display:block;width:100%;margin-top:24px;border-radius:14px;border:1px solid var(--line)}

/* section heading */
.sh{display:flex;align-items:baseline;gap:12px;margin:64px 0 20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sh span{font:400 .72rem var(--mono);color:var(--muted)}
.sh h2{margin:0;font:500 1rem var(--sans);letter-spacing:.01em}

/* deals carousel */
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:14px;gap:0}
.slides::-webkit-scrollbar{display:none}
.deal{flex:0 0 100%;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.deal .logo{height:150px;background:#fff;display:grid;place-items:center;color:#111;font:700 2.2rem var(--sans);letter-spacing:-.03em;text-align:center;padding:12px}
.deal .logo img{max-width:70%;max-height:100px;object-fit:contain}
.deal .body{padding:18px}
.badge{display:inline-block;padding:3px 10px;border-radius:7px;background:var(--warm-bg);color:var(--warm);font:600 .75rem var(--mono)}
.deal .shop{margin-left:10px;color:var(--muted);font-size:.85rem}
.deal h3{margin:12px 0 4px;font:600 1.1rem var(--sans)}
.deal p{margin:0;color:var(--muted)}
.code{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px}
.code code{flex:1;font:600 1rem var(--mono);letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-size:.85rem}
.btn:hover{border-color:var(--muted)}
.btn.block{display:flex;width:100%;margin-top:12px;padding:12px;background:var(--surface2)}
.thanks{margin:12px 0 0;text-align:center;color:var(--muted);font-size:.78rem;font-style:italic}
.ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.ctrl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.dots{display:flex;gap:6px}
.dots button{all:unset;cursor:pointer;width:7px;height:7px;border-radius:7px;background:var(--line);transition:width .2s,background .2s}
.dots button[aria-current="true"]{width:26px;background:var(--text)}

/* gear */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.seg button{border:0;background:transparent;padding:10px;border-radius:9px;color:var(--muted);font-weight:500}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px 0 4px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font:400 .72rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.grow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.thumb{width:44px;height:44px;border-radius:9px;background:#fff;object-fit:contain;display:grid;place-items:center;border:1px solid var(--line)}
.thumb.ph{background:var(--surface2);color:var(--muted);font:500 .8rem var(--mono)}
.txt{display:grid;grid-template-columns:104px 1fr;gap:2px 12px;align-items:baseline;min-width:0}
.cat{font:400 .66rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nm{font-weight:500}
.why{grid-column:2;color:var(--muted);font-size:.82rem;margin-top:-2px}
.buy{display:flex;align-items:center;gap:12px}
.price{font:500 .85rem var(--mono);color:var(--warm)}
.note{margin:16px 0 0;color:var(--muted);font-size:.78rem}

/* reviews */
.rev{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.rev .sc{font:600 1.15rem var(--mono)}
.rev b{font-weight:500}
.rev p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.rev .pc{margin-top:4px;font:400 .72rem var(--mono)}
.pc .p{color:var(--good)} .pc .m{color:var(--warm);margin-left:10px}

/* form */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{margin:0 0 4px;font:600 1.05rem var(--sans)}
.card > p{margin:0 0 16px;color:var(--muted)}
.field{display:block;width:100%;margin-bottom:10px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit}
.field::placeholder{color:var(--muted)}
textarea.field{min-height:120px;resize:vertical}
.send{width:100%;padding:12px;border-radius:10px;border:0;background:var(--text);color:var(--bg);font-weight:600}
#fstat{min-height:1.4em;margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{padding:5px 11px;border-radius:999px;background:var(--surface2);font-size:.78rem;color:var(--muted)}

/* analytics */
.stack{display:grid;gap:14px}
.ahead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.ahead h3{margin:0;font:600 1.05rem var(--sans)}
.ahead small{color:var(--muted);font:400 .68rem var(--mono)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{padding:14px 10px;border-radius:10px;background:var(--surface2);text-align:center}
.tile .n{font:600 1.3rem/1.1 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .l{margin-top:4px;color:var(--muted);font-size:.78rem}
.tile .d{font:500 .72rem var(--mono);margin-top:2px}
.up{color:var(--good)} .down{color:var(--warm)}
.spark{display:block;width:100%;height:56px;margin-top:14px;stroke:var(--text);fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;opacity:.8}
.sub{margin:18px 0 8px;font:400 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;margin:7px 0;font:400 .78rem var(--mono);color:var(--muted)}
.bar i{display:block;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--text);border-radius:6px}
.bar span:last-child{text-align:right}
.loc{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem}
.loc em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:.78rem;margin-left:4px}
.upd{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font:400 .75rem var(--mono)}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.78rem}

@media (max-width:560px){
  .txt{grid-template-columns:1fr}
  .why{grid-column:1}
  .col{padding-top:64px}
}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="Сменить тему">◐</button>

<main class="col">
  <header class="profile">
    <div id="avatar"></div>
    <h1 id="name"></h1>
    <p class="meta" id="meta"></p>
    <p class="bio" id="bio"></p>
    <div class="strip" id="strip" aria-live="polite"></div>
  </header>

  <nav class="links" id="links" aria-label="Ссылки"></nav>
  <img class="hero-img" id="heroimg" alt="" hidden>

  <div class="sh"><span>01</span><h2>Скидки и промокоды</h2></div>
  <div class="slides" id="slides" tabindex="0" aria-label="Скидки"></div>
  <div class="ctrl">
    <button id="prev" aria-label="Назад">←</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="Вперёд">→</button>
  </div>

  <div class="sh"><span>02</span><h2>Мой гир</h2></div>
  <div class="seg" role="tablist" aria-label="Раздел гира">
    <button role="tab" id="t-periph" aria-selected="true">Периферия</button>
    <button role="tab" id="t-specs" aria-selected="false">Спеки ПК</button>
  </div>
  <div class="chips" id="chips" aria-label="Тип устройства"></div>
  <div id="glist" role="tabpanel"></div>
  <p class="note">Ссылки партнёрские: если купите по ним, я получу комиссию, а цена для вас не изменится.</p>

  <div id="revwrap" hidden>
    <div class="sh"><span>03</span><h2>Обзоры</h2></div>
    <div id="revs"></div>
  </div>

  <div class="sh"><span>04</span><h2>Сотрудничество</h2></div>
  <form class="card" id="form">
    <h3>Работаем вместе</h3>
    <p id="cdesc"></p>
    <input class="field" name="email" type="email" placeholder="Ваша почта" required autocomplete="email">
    <input class="field" name="subject" placeholder="Тема" required>
    <textarea class="field" name="message" placeholder="Сообщение…" required></textarea>
    <button class="send" type="submit">Отправить</button>
    <div id="fstat" aria-live="polite"></div>
    <div class="tags" id="tags"></div>
  </form>

  <div class="sh"><span>05</span><h2>Аналитика</h2></div>
  <div class="stack" id="analytics"></div>
  <div class="upd" id="upd"></div>

  <footer id="foot"></footer>
</main>

<script>
/* ================== РЕДАКТИРУЙТЕ ТОЛЬКО ЭТОТ БЛОК ================== */
const SITE = {
  name: "yourname",
  verified: false,
  avatar: "img/avatar.jpg",                 // положите фото в папку img (если файла нет — будет буква)
  heroImage: "",                            // например "img/setup.jpg"; пусто = не показывать
  meta: ["Страна", "1 год в контенте", "PC-контент"],
  bio: "Делаю контент про PC-сетапы, периферию и распаковки. Показываю чистые, эстетичные видео про свой стол, гир и апгрейды.",
  email: "hello@yourdomain.com",
  country: "Страна"
};
const CONTACT = {
  description: "Открыт к спонсорству, обзорам и коллаборациям. Напишите мне.",
  endpoint: "",  // адрес формы Formspree (https://formspree.io/f/xxxx). Пусто = письмо откроется в почтовой программе
  tags: ["Спонсорские обзоры", "Партнёрские программы", "Амбассадорство", "Розыгрыши", "Распаковки"]
};
const LINKS = [
  { mono: "TT", label: "TikTok",    handle: "@yourname", url: "https://tiktok.com/@yourname" },
  { mono: "IG", label: "Instagram", handle: "@yourname", url: "https://instagram.com/yourname" },
  { mono: "YT", label: "YouTube",   handle: "@yourname", url: "https://youtube.com/@yourname" },
  { mono: "@",  label: "Почта",     handle: "hello@yourdomain.com", url: "mailto:hello@yourdomain.com" }
];

/* Скидки. logo: путь к картинке (необязательно). Без logo показывается название магазина. */
const DEALS = [
  { shop: "Магазин 1", off: "−5%",  title: "Магазин 1 — скидка на всё", text: "Механические клавиатуры, кейкапы и аксессуары.", code: "YOURNAME", url: "#", logo: "" },
  { shop: "Магазин 2", off: "−10%", title: "Магазин 2 — периферия",     text: "Мыши, коврики и аксессуары для игр.",          code: "YOURNAME10", url: "#", logo: "" }
];

/* Периферия: плоский список. type — тип устройства (по нему работает фильтр).
   img — картинка товара (необязательно), price — цена (необязательно), why — короткая пометка. */
const GEAR = [
  { type: "Монитор",    name: "Название монитора", why: "OLED 240 Гц",         url: "#", img: "", price: "" },
  { type: "Стол",       name: "Название стола",    why: "",                    url: "#", img: "", price: "" },
  { type: "Кресло",     name: "Название кресла",   why: "",                    url: "#", img: "", price: "" },
  { type: "Клавиатура", name: "Название клавиатуры", why: "Тихие линейные свичи", url: "#", img: "", price: "$149" },
  { type: "Мышь",       name: "Название мыши",     why: "55 г, беспроводная",  url: "#", img: "", price: "$99" },
  { type: "Коврик",     name: "Название коврика",  why: "",                    url: "#", img: "", price: "" },
  { type: "Микрофон",   name: "Название микрофона", why: "",                   url: "#", img: "", price: "$89" },
  { type: "Наушники",   name: "Название наушников", why: "",                   url: "#", img: "", price: "$129" },
  { type: "Камера",     name: "Название камеры",   why: "",                    url: "#", img: "", price: "" }
];

/* Спеки ПК */
const SPECS = [
  { k: "Процессор",   v: "AMD Ryzen 7 7800X3D",    url: "#" },
  { k: "Видеокарта",  v: "NVIDIA RTX 4070 Super",  url: "#" },
  { k: "Память",      v: "32 ГБ DDR5 6000",        url: "#" },
  { k: "Материнка",   v: "Название платы",         url: "#" },
  { k: "Накопитель",  v: "NVMe 2 ТБ",              url: "#" },
  { k: "Блок питания", v: "850 Вт 80+ Gold",       url: "#" },
  { k: "Корпус",      v: "Название корпуса",       url: "#" }
];

/* Обзоры. Оставьте массив пустым [], чтобы скрыть раздел. */
const REVIEWS = [
  { title: "Название устройства", score: "9.0", text: "Две недели ежедневного использования, вывод в одну строку.", pros: "Лёгкая, сенсор", cons: "Цена", url: "#" }
];

/* Аудитория: данные из ваших приложений, вводятся вручную (API их не отдаёт) */
const AUDIENCE = {
  updated: "2026-10-01",
  period: "последние 28 дней",
  ages: [["18–24", 38], ["25–34", 45], ["35–44", 9], ["45+", 8]],
  countries: [["США", 12], ["Индия", 8], ["Турция", 7], ["Бразилия", 5]]
};
/* ====================================================================== */

const PLAT = { tiktok: "TikTok", instagram: "Instagram", youtube: "YouTube" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K = (n) => {
  if (n == null || isNaN(n)) return "—";
  const a = Math.abs(n);
  if (a >= 1e6) return String(+(n / 1e6).toFixed(a >= 1e7 ? 1 : 2)) + "M";
  if (a >= 1e3) return String(+(n / 1e3).toFixed(1)) + "K";
  return String(n);
};
const REL = 'rel="sponsored nofollow noopener noreferrer" target="_blank"';
const dateRu = (d) => new Date(d).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });

/* тема */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const next = cur === "light" ? "dark" : "light";
  root.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
};

/* профиль */
document.title = SITE.name + " — Creator Hub";
const av = $("#avatar");
const img = new Image(); img.className = "avatar"; img.alt = SITE.name;
img.onload = () => av.replaceWith(img);
img.onerror = () => { av.className = "avatar"; av.textContent = SITE.name.charAt(0).toUpperCase(); };
img.src = SITE.avatar;
$("#name").innerHTML = esc(SITE.name) + (SITE.verified ? '<svg width="18" height="18" viewBox="0 0 24 24" aria-label="Подтверждён"><circle cx="12" cy="12" r="11" fill="#3b82f6"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : "");
$("#meta").textContent = SITE.meta.join("  ·  ");
$("#bio").textContent = SITE.bio;
$("#links").innerHTML = LINKS.map(l =>
  `<a class="link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><span class="ic">${esc(l.mono)}</span><span><b>${esc(l.label)}</b><small>${esc(l.handle)}</small></span><span class="go">→</span></a>`).join("");
if (SITE.heroImage) { const h = $("#heroimg"); h.src = SITE.heroImage; h.hidden = false; h.onerror = () => h.remove(); }
$("#cdesc").textContent = CONTACT.description;
$("#tags").innerHTML = CONTACT.tags.map(t => `<span>${esc(t)}</span>`).join("");
$("#foot").textContent = `${SITE.name} · ${SITE.country} · Партнёрские ссылки помогают поддерживать контент`;

/* скидки: карусель */
$("#slides").innerHTML = DEALS.map((d, i) =>
  `<article class="deal"><div class="logo">${d.logo ? `<img src="${esc(d.logo)}" alt="${esc(d.shop)}">` : esc(d.shop)}</div>
   <div class="body"><span class="badge">${esc(d.off)}</span><span class="shop">${esc(d.shop)}</span>
   <h3>${esc(d.title)}</h3><p>${esc(d.text)}</p>
   <div class="code"><code>${esc(d.code)}</code><button class="btn" data-copy="${i}">Копировать</button></div>
   <a class="btn block" href="${esc(d.url)}" ${REL}>Перейти в магазин ↗</a>
   <p class="thanks">Спасибо, что поддерживаете меня кодом!</p></div></article>`).join("");
const sl = $("#slides");
$("#dots").innerHTML = DEALS.map((_, i) => `<button aria-label="Слайд ${i + 1}" data-i="${i}"></button>`).join("");
const syncDots = () => {
  const i = Math.round(sl.scrollLeft / sl.clientWidth);
  document.querySelectorAll("#dots button").forEach((b, j) => b.setAttribute("aria-current", j === i));
};
sl.addEventListener("scroll", syncDots, { passive: true }); syncDots();
$("#prev").onclick = () => sl.scrollBy({ left: -sl.clientWidth, behavior: "smooth" });
$("#next").onclick = () => sl.scrollBy({ left: sl.clientWidth, behavior: "smooth" });
$("#dots").onclick = (e) => { const b = e.target.closest("button"); if (b) sl.scrollTo({ left: b.dataset.i * sl.clientWidth, behavior: "smooth" }); };
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  try { await navigator.clipboard.writeText(DEALS[b.dataset.copy].code); b.textContent = "Скопировано"; }
  catch { b.textContent = "Скопируйте вручную"; }
  setTimeout(() => b.textContent = "Копировать", 1800);
});

/* гир */
let tab = "periph", filter = "all";
const types = [...new Set(GEAR.map(g => g.type))];
function renderGear() {
  $("#t-periph").setAttribute("aria-selected", tab === "periph");
  $("#t-specs").setAttribute("aria-selected", tab === "specs");
  const chips = $("#chips");
  chips.hidden = tab !== "periph";
  if (tab === "periph") {
    chips.innerHTML = ["all", ...types].map(t => `<button class="chip" data-f="${esc(t)}" aria-pressed="${filter === t}">${t === "all" ? "Все" : esc(t)}</button>`).join("");
    $("#glist").innerHTML = GEAR.filter(g => filter === "all" || g.type === filter).map(g => {
      const th = g.img ? `<img class="thumb" src="${esc(g.img)}" alt="" loading="lazy">` : `<span class="thumb ph">${esc(g.type.slice(0, 2))}</span>`;
      return `<div class="grow">${th}<div class="txt"><span class="cat">${esc(g.type)}</span><span class="nm">${esc(g.name)}</span>${g.why ? `<span class="why">${esc(g.why)}</span>` : ""}</div>
        <div class="buy">${g.price ? `<span class="price">${esc(g.price)}</span>` : ""}<a class="btn" href="${esc(g.url)}" ${REL}>Купить ↗</a></div></div>`;
    }).join("");
  } else {
    $("#glist").innerHTML = SPECS.map(s =>
      `<div class="grow"><span class="thumb ph">${esc(s.k.slice(0, 2))}</span><div class="txt"><span class="cat">${esc(s.k)}</span><span class="nm">${esc(s.v)}</span></div>
       <div class="buy"><a class="btn" href="${esc(s.url)}" ${REL}>Купить ↗</a></div></div>`).join("");
  }
}
$("#t-periph").onclick = () => { tab = "periph"; renderGear(); };
$("#t-specs").onclick = () => { tab = "specs"; renderGear(); };
$("#chips").onclick = (e) => { const c = e.target.closest(".chip"); if (c) { filter = c.dataset.f; renderGear(); } };
renderGear();

/* обзоры */
if (REVIEWS.length) {
  $("#revwrap").hidden = false;
  $("#revs").innerHTML = REVIEWS.map(r =>
    `<div class="rev"><span class="sc">${esc(r.score)}</span><div><b>${esc(r.title)}</b><p>${esc(r.text)}</p><div class="pc"><span class="p">+ ${esc(r.pros)}</span><span class="m">− ${esc(r.cons)}</span></div></div>
     <a class="btn" href="${esc(r.url)}" ${REL}>Читать</a></div>`).join("");
}

/* форма: Formspree или письмо в почтовой программе */
$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f)), st = $("#fstat");
  if (CONTACT.endpoint) {
    try {
      const r = await fetch(CONTACT.endpoint, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(d) });
      st.textContent = r.ok ? "Отправлено, спасибо!" : "Не удалось отправить. Напишите на почту.";
      if (r.ok) f.reset();
    } catch { st.textContent = "Не удалось отправить. Напишите на почту."; }
  } else {
    location.href = `mailto:${SITE.email}?subject=${encodeURIComponent(d.subject)}&body=${encodeURIComponent(d.message + "\n\nОт: " + d.email)}`;
    st.textContent = "Открываю почтовую программу…";
  }
});

/* статистика */
function spark(v) {
  if (!v || v.length < 2) return "";
  const mn = Math.min(...v), mx = Math.max(...v), r = mx - mn || 1;
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polyline points="${v.map((x, i) => `${(i / (v.length - 1) * 100).toFixed(1)},${(26 - (x - mn) / r * 24).toFixed(1)}`).join(" ")}" vector-effect="non-scaling-stroke"/></svg>`;
}
function render(data) {
  const P = (data && data.platforms) || {}, H = (data && data.history) || [];
  const series = (k) => H.map(h => h[k]).filter(v => typeof v === "number");
  $("#strip").innerHTML = ["tiktok", "instagram", "youtube"].map(k => `<div><div class="n">${K(P[k] && P[k].followers)}</div><div class="l">${PLAT[k]}</div></div>`).join("");
  $("#analytics").innerHTML = ["tiktok", "instagram", "youtube"].map(k => {
    const p = P[k] || {}, s = series(k), d = s.length > 1 ? s[s.length - 1] - s[s.length - 2] : null;
    const tiles = [
      [K(p.followers), "Подписчики", d == null ? "" : `<div class="d ${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : "−"}${K(Math.abs(d))} за нед.</div>`],
      p.posts != null ? [K(p.posts), "Публикации", ""] : null,
      p.views != null ? [K(p.views), "Просмотры", ""] : null
    ].filter(Boolean);
    return `<section class="card"><div class="ahead"><h3>${PLAT[k]}</h3><small>авто · раз в неделю</small></div>
      <div class="tiles">${tiles.map(t => `<div class="tile"><div class="n">${t[0]}</div><div class="l">${t[1]}</div>${t[2]}</div>`).join("")}</div>${spark(s)}</section>`;
  }).join("") + `<section class="card"><div class="ahead"><h3>Аудитория</h3><small>${esc(AUDIENCE.period)}</small></div>
    <div class="sub">Возраст</div>${AUDIENCE.ages.map(a => `<div class="bar"><span>${esc(a[0])}</span><i><b style="width:${a[1]}%"></b></i><span>${a[1]}%</span></div>`).join("")}
    <div class="sub">Топ стран</div><div class="loc">${AUDIENCE.countries.map(c => `<span>${esc(c[0])}<em>${c[1]}%</em></span>`).join("")}</div></section>`;
  $("#upd").textContent = (data && data.updated ? "Подписчики и публикации обновлены: " + dateRu(data.updated) : "Автоданные ещё не загружены") + "  ·  Аудитория: " + dateRu(AUDIENCE.updated);
}
render(null);
fetch("stats.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : Promise.reject()).then(render).catch(() => {});
</script>
</body>
</html>
